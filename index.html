<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkline Associates — Contact</title>
<style>
  :root{
    --navy-deep:#050b1f;
    --navy-panel:#0b1530;
    --blue:#2f6df6;
    --blue-soft:#4d8bff;
    --gold:#f2b23c;
    --gold-soft:#f6c766;
    --ink-100:#f4f7ff;
    --ink-300:#aeb9d6;
    --ink-500:#7683a6;
    --line:rgba(255,255,255,0.08);
  }

  *{box-sizing:border-box; min-width:0;}

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    max-width:100vw;
    overflow-x:hidden;
    background:var(--navy-deep);
    color:var(--ink-100);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  img, svg{ max-width:100%; }

  a{color:inherit; text-decoration:none;}

  .stage{
    position:relative;
    min-height:100vh;
    width:100%;
    max-width:100vw;
    overflow:hidden;
    display:flex;
    justify-content:center;
  }

  .stage::before,
  .stage::after{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    border:1.5px solid;
    pointer-events:none;
  }
  .stage::before{
    top:-260px;
    left:-260px;
    border-color: rgba(79,139,255,0.55);
    box-shadow: 0 0 60px rgba(79,139,255,0.15) inset;
  }
  .stage::after{
    top:-220px;
    right:-260px;
    border-color: rgba(246,199,102,0.55);
    box-shadow: 0 0 60px rgba(246,199,102,0.12) inset;
  }

  .glow-line{
    position:absolute;
    bottom:-140px;
    left:-10%;
    width:120%;
    height:280px;
    border-radius:50%;
    background:
      radial-gradient(closest-side, rgba(79,139,255,0.18), transparent 70%);
    pointer-events:none;
  }
  .glow-line.gold{
    bottom:-190px;
    background:
      radial-gradient(closest-side, rgba(246,199,102,0.12), transparent 70%);
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    padding:56px 20px 40px;
  }

  /* ---------- Logo ---------- */
  .logo-wrap{
    text-align:center;
    margin-bottom:6px;
  }
  .logo-svg{
    width:min(92%, 360px);
    height:auto;
    display:inline-block;
  }
  .tagline-row{
    text-align:center;
    font-size:13px;
    letter-spacing:0.16em;
    color:var(--blue-soft);
    font-weight:600;
    margin-top:2px;
  }
  .tagline-row span.sep{
    color:var(--gold);
    margin:0 10px;
    letter-spacing:normal;
  }

  .subtitle{
    text-align:center;
    margin:34px 0 30px;
    font-size:17px;
    color:var(--ink-300);
    font-weight:400;
    letter-spacing:0.01em;
  }
  .subtitle .dot{
    color:var(--gold);
    margin:0 12px;
  }

  /* ---------- Contact grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-bottom:30px;
  }
  @media (min-width:520px){
    .grid{grid-template-columns:1fr 1fr;}
    .tile.website{grid-column:1 / -1;}
  }

  .tile{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
    border:1px solid var(--line);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    cursor:pointer;
  }
  .tile:hover{
    transform:translateY(-2px);
  }
  .tile:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .tile.whatsapp{ border-color:rgba(60,201,120,0.45); }
  .tile.call{ border-color:rgba(79,139,255,0.45); }
  .tile.instagram{ border-color:rgba(214,80,180,0.4); }
  .tile.email{ border-color:rgba(79,139,255,0.45); }
  .tile.website{ border-color:rgba(140,110,240,0.45); }

  .tile .icon{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile .icon svg{width:20px; height:20px;}

  .icon.wa{background:#25d366;}
  .icon.phone{background:#2f6df6;}
  .icon.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);}
  .icon.mail{background:#2f6df6;}
  .icon.web{background:#7c5cf2;}

  .tile .text{flex:1; min-width:0;}
  .tile .label{
    font-size:14px;
    font-weight:700;
    color:var(--ink-100);
  }
  .tile .value{
    font-size:12.5px;
    color:var(--ink-500);
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tile .chev{
    flex:0 0 auto;
    color:var(--ink-500);
    font-size:16px;
  }

  /* ---------- CTA buttons ---------- */
  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    margin-bottom:14px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .cta.primary{
    background:linear-gradient(180deg, #3f7bff, #2a5fe0);
    color:#fff;
    box-shadow:0 0 26px rgba(63,123,255,0.45);
  }
  .cta.secondary{
    background:transparent;
    border-color:var(--gold);
    color:var(--gold-soft);
  }
  .cta svg{width:18px; height:18px;}

  footer{
    text-align:center;
    margin-top:34px;
    color:var(--ink-500);
  }
  .footer-rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink-300);
  }
  .footer-rule::before,
  .footer-rule::after{
    content:"";
    height:1px;
    width:36px;
    background:var(--gold);
    opacity:0.6;
  }
  .footer-sub{
    margin-top:8px;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-500);
  }
</style>
</head>
